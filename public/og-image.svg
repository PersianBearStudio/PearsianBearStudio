<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#101114"/>

  <!-- Background grid -->
  <g opacity="0.18" stroke="#2B2C30" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>

  <!-- Bear emblem (top left) -->
  <g transform="translate(120, 130)">
    <circle cx="18" cy="16" r="11" fill="none" stroke="#F4F1EA" stroke-width="2.4"/>
    <circle cx="46" cy="16" r="11" fill="none" stroke="#F4F1EA" stroke-width="2.4"/>
    <circle cx="18" cy="16" r="3.5" fill="#F07835"/>
    <circle cx="46" cy="16" r="3.5" fill="#F07835"/>
    <rect x="6" y="18" width="64" height="64" rx="22" ry="22" fill="none" stroke="#F4F1EA" stroke-width="2.4"/>
    <circle cx="25" cy="46" r="3" fill="#F4F1EA"/>
    <circle cx="55" cy="46" r="3" fill="#F4F1EA"/>
    <line x1="28" y1="59" x2="48" y2="59" stroke="#F4F1EA" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="18" y1="34" x2="62" y2="34" stroke="#F07835" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="120" y="380" font-family="Manrope, system-ui, sans-serif" font-weight="600" font-size="64" letter-spacing="-2" fill="#F4F1EA">
    PersianBear<tspan fill="#F07835">Studio</tspan>
  </text>

  <!-- Eyebrow -->
  <line x1="120" y1="430" x2="160" y2="430" stroke="#F07835" stroke-width="2"/>
  <text x="172" y="436" font-family="Manrope, system-ui, sans-serif" font-weight="500" font-size="18" letter-spacing="6" fill="#A6A6A8" text-transform="uppercase">
    INDEPENDENT WEB DEVELOPMENT STUDIO
  </text>

  <!-- Headline -->
  <text x="120" y="510" font-family="Manrope, system-ui, sans-serif" font-weight="600" font-size="44" letter-spacing="-1.5" fill="#F4F1EA">
    Good Ideas. Precise Execution.
  </text>
