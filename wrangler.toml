# Cloudflare Workers configuration for PersianBearStudio
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Quick start:
#   npm run build       # build the static site to dist/
#   npm run dev:worker  # local Worker dev at http://localhost:8787
#   npm run deploy      # publish the Worker + assets to Cloudflare
#
# The Worker (src/worker.ts) serves the static Astro build from dist/
# through the Workers Assets binding and applies security headers to
# every response. No backend, no database, no SSR.

name = "persianbearstudio"
main = "src/worker.ts"
compatibility_date = "2026-09-23"

# Serve the static Astro build (dist/) through the Worker.
# - `directory` is the path to the built site (created by `npm run build`).
# - `binding = "ASSETS"` exposes the binding to the Worker as `env.ASSETS`.
# - `run_worker_first = true` forces EVERY request through the Worker
#   (instead of letting the assets binding short-circuit on file matches).
#   This is what guarantees our security headers are applied to all
#   responses, including static files like CSS, JS, images, sitemap.
# - `not_found_handling = "404"` returns a real 404 for unknown paths. The
#   site is a single page whose "routes" are in-page fragments (/#studio,
#   /#contact), so an SPA fallback would only create Soft-404 duplicates.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404"

# Observability — request counts and errors appear in the Cloudflare
# dashboard. Safe to remove if you don't want Cloudflare to collect this.
[observability]
enabled = true

# ---------------------------------------------------------------------------
# Production routing — uncomment and edit when you have a real domain.
# Without these, the Worker is reachable at `<worker-name>.<account>.workers.dev`
# (which is fine for previewing). To route a custom domain:
#
#   1. Add the domain to your Cloudflare account (DNS only — no proxy needed).
#   2. Uncomment the `routes` block below and replace `persianbearstudio.com`
#      with your real domain.
#   3. Run `npm run deploy`.
#
# routes = [
#   { pattern = "persianbearstudio.com/*", custom_domain = true }
# ]
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Staging environment (optional)
# Deploy a separate staging Worker with: `npx wrangler deploy --env staging`
# [env.staging]
# name = "persianbearstudio-staging"
# routes = [
#   { pattern = "staging.persianbearstudio.com/*", custom_domain = true }
# ]
# ---------------------------------------------------------------------------
